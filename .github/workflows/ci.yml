name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -uo pipefail
          n=0
          until [ "$n" -ge 3 ]; do
            # CPU-only torch first (same as the Dockerfile) — the default Linux
            # wheel pulls ~2 GB of CUDA libraries the embedding model never uses.
            pip install torch --index-url https://download.pytorch.org/whl/cpu \
              && pip install -r requirements.txt && exit 0
            n=$((n + 1))
            echo "pip install failed (attempt $n/3), retrying in 10s..."
            sleep 10
          done
          echo "::error::pip install failed after 3 attempts"
          exit 1

      - name: Lint with ruff
        run: ruff check codebase/ tests/ scripts/ eval/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          JWT_SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-production

      # Rule engine (real create_glucose_record path), input validation and
      # deterministic intent routing on production code — no LLM, no network.
      # Fails only when a module passes fewer cases than eval/baseline.json.
      - name: Deterministic eval (regression gate)
        run: python eval/run_eval.py --baseline eval/baseline.json --output eval/results/ci-latest.json
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          JWT_SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-production
          QDRANT_LOCATION: ":memory:"

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/results/ci-latest.json
          if-no-files-found: ignore

  # Task 6.6: secrets and vulnerable dependencies. GitHub-hosted, so nothing
  # left over on the self-hosted runner changes the result.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only the commits this push/PR adds: a finding blocks the change that
      # introduces it. A full-history scan is a one-off — docs/SECURITY_CI.md.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: "8.28.0"
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          cd "$GITHUB_WORKSPACE"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            range="$PUSH_AFTER~1..$PUSH_AFTER"
          fi
          echo "scanning $range"
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --log-opts="$range" --redact --verbose --exit-code 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Audits exactly what requirements.txt resolves to (metadata only, no
      # install). Ignored, eval-only (ragas, used by `make eval-*` on a
      # developer machine, never imported by the backend):
      #   PYSEC-2026-3046/3047 ragas — file/URL reads in multimodal metrics we don't use
      #   PYSEC-2026-2447 diskcache (via ragas) — pickle in a local cache dir; needs write access to it
      # Re-check when ragas is upgraded (requirements.txt explains the pin).
      - name: Dependency audit (Python)
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip pip-audit
          python -m pip install --dry-run --ignore-installed --quiet --report "$RUNNER_TEMP/resolved.json" -r requirements.txt
          python -c "import json,sys; r=json.load(open(sys.argv[1], encoding='utf-8')); print('\n'.join(f\"{i['metadata']['name']}=={i['metadata']['version']}\" for i in r['install']))" \
            "$RUNNER_TEMP/resolved.json" >"$RUNNER_TEMP/resolved.txt"
          pip-audit -r "$RUNNER_TEMP/resolved.txt" --no-deps --disable-pip --progress-spinner off \
            --ignore-vuln PYSEC-2026-3046 --ignore-vuln PYSEC-2026-3047 --ignore-vuln PYSEC-2026-2447

  # The test suite runs on SQLite; native enum types and index drift only
  # exist on Postgres, which is where the startup schema repair in db.py
  # matters. GitHub-hosted runner for the service container.
  backend-postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diab_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Schema bootstrap and drift repair on Postgres
        run: python -m scripts.check_schema_bootstrap
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: diab_ci
          JWT_SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-production
          QDRANT_LOCATION: ":memory:"

  frontend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: codebase/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: codebase/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Task 6.6: what ships to the browser/server; dev tooling is audited by hand.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      # Warnings (React Compiler-era hook rules, unused imports) are reported
      # but don't fail the job; errors do. See eslint.config.mjs.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Every NEXT_PUBLIC_* variable has an in-code fallback, so no .env is needed.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
