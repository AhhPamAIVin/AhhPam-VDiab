image: python:3.11-slim

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key:
    files:
      - requirements.txt
  paths:
    - .cache/pip

lint-and-test:
  stage: test
  # No `tags:` — this lets the job land on GitLab's shared SaaS runners
  # instead of requiring a self-hosted/self-managed runner. No `rules:`
  # either: GitLab's default workflow already runs branch pipelines for
  # every branch push (not just main/develop).
  variables:
    APP_ENV: test
    OPENAI_API_KEY: test-key
    JWT_SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-production
  before_script:
    - pip install -r requirements.txt
  script:
    - ruff check codebase/ tests/
    - pytest tests/ -v --tb=short
