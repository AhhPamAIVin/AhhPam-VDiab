      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Khong tim thay tai nguyen
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Du lieu request khong hop le (loi tung field, xem error.fields)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Xung dot du lieu (vd email da ton tai)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Vuot qua gioi han so lan goi (rate limit)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnexpectedError:
      description: Loi khong xac dinh khac (400, 404, 409, 429, 500 ...) — luon co dang ErrorResponse
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ImplUnauthorized:
      description: Chưa xác thực hoặc access token không hợp lệ/hết hạn (detail thường là "Could not validate
