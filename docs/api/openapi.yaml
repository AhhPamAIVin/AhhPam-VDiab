      description: 'Header Authorization: Bearer <access_token> lấy từ POST /auth/login. Access token
        hết hạn sau access_token_expire_minutes (mặc định 60 phút) và backend hiện KHÔNG có refresh token
        — phải đăng nhập lại. (Phần ''planned'' của tài liệu vẫn còn mô tả refresh token qua cookie HttpOnly
        kế thừa từ bản gốc — chưa được backend triển khai, xem tag Auth.)'
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Trang hien tai (mac dinh 1)
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: So ban ghi moi trang (mac dinh 20, toi da 100)
    SortParam:
      name: sort
