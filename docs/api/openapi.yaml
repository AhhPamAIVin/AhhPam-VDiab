      required: false
      schema:
        type: string
      description: Ten field dung de sap xep
    OrderParam:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
        default: asc
      description: Thu tu sap xep
    FromParam:
      name: from
      in: query
      required: false
      schema:
        type: string
      description: Bat dau khoang thoi gian (ISO-8601 datetime hoac YYYY-MM-DD tuy endpoint)
    ToParam:
      name: to
      in: query
      required: false
      schema:
        type: string
      description: Ket thuc khoang thoi gian (ISO-8601 datetime hoac YYYY-MM-DD tuy endpoint)
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Khoa idempotent cho cac POST de gui lap (ghi chi so, bua an, medication intake)
  responses:
    Unauthorized:
      description: Chua xac thuc hoac access token het han / khong hop le
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Da xac thuc nhung khong co quyen truy cap tai nguyen nay (sai role hoac khong duoc
