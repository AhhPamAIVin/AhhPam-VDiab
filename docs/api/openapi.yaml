openapi: 3.0.3
info:
  title: VDiab API
  version: 1.1.0
  description: "Đặc tả REST API cho hệ thống VDiab (Diabetes Health Management System).\n\nTài liệu này\
    \ có hai lớp nội dung, phân biệt bằng `x-status` trên từng operation:\n\n- `x-status: implemented`\
    \ — endpoint có thật trong `codebase/backend` hôm nay, đối chiếu trực\n  tiếp với router/service/model\
    \ khi viết tài liệu này. Path, verb, schema, mã lỗi mô tả đúng\n  hành vi hiện tại.\n- `x-status:\
    \ planned` — hợp đồng dự kiến, kế thừa từ bản đặc tả gốc (chuyển thể từ\n  `docs/API_SPEC.docx` và\
    \ dữ liệu giả lập dự kiến cho frontend, hiện `frontend/` gần như trống).\n  Backend **chưa** triển\
    \ khai các endpoint này; giữ lại để làm tài liệu tham chiếu/roadmap, không\n  phải hợp đồng đang chạy.\
    \ Mô tả của từng tag bên dưới ghi rõ phần nào thuộc lớp nào.\n\n**Hai bộ quy ước khác nhau giữa hai\
    \ lớp — đọc kỹ trước khi tích hợp:**\n\n- Endpoint `implemented`: response trả thẳng object/mảng (KHÔNG\
    \ bọc trong `{ \"data\": ... }`),\n  danh sách trả toàn bộ (không có `meta` phân trang), lỗi theo\
    \ định dạng mặc định của FastAPI —\n  `{ \"detail\": \"...\" }` cho lỗi thường (400/401/403/404/409),\
    \ `{ \"detail\": [{ loc, msg, type }] }`\n  cho lỗi 422. Đăng nhập dùng OAuth2 password flow\n  (`application/x-www-form-urlencoded`,\
    \ field `username`/`password`), không có refresh\n  token/cookie — access token hết hạn (mặc định\
    \ 60 phút) thì phải đăng nhập lại. Mọi request\n  (query string, JSON/form body) còn đi qua `SQLInjectionGuardMiddleware`:\
    \ khớp pattern SQL\n  injection phổ biến (union select, drop table, tautology `' OR '1'='1`, stacked\
    \ queries...) thì\n  trả `400 { \"detail\": \"Request rejected: invalid input detected\" }` trước\
    \ khi vào route.\n- Endpoint `planned`: giữ nguyên quy ước từ bản đặc tả gốc — response bọc `{ \"\
    data\": ... }` (danh\n  sách kèm `meta` phân trang), lỗi trả `{ \"error\": { code, message, fields?,\
    \ requestId } }`, đăng\n  nhập bằng JSON + access token/refresh token qua cookie HttpOnly. **Quy ước\
    \ này chưa được backend\n  áp dụng cho bất kỳ endpoint nào** — nếu triển khai tiếp các endpoint `planned`,\
    \ cần thống nhất\n  lại với backend xem giữ nguyên kiểu flat/detail hiện tại hay đổi backend sang\
    \ bọc `data`/`error`\n  cho nhất quán toàn API.\n\nNgoài các endpoint dưới `/api/v1`, backend còn\
    \ expose `GET /health` ở root (ngoài `/api/v1`, xem\ntag Infra) dùng cho healthcheck hạ tầng.\n\n\
    **Nhóm người dùng**: `patient`, `doctor`, `admin` — như thiết kế gốc.\n\n**Quy ước chung của phần\
    \ \"planned\"** (giữ nguyên từ bản gốc, xem trên để biết vì sao không áp\ndụng cho phần \"implemented\"\
    ):\n\n- ID là UUID dạng chuỗi. Thời gian dùng ISO-8601 UTC (vd `2026-08-03T07:15:00Z`); ngày không\
    \ kèm\n  giờ dùng `YYYY-MM-DD`.\n- Field enum dùng tiếng Anh ổn định; frontend chịu trách nhiệm dịch\
    \ nhãn tiếng Việt.\n- Field không có dữ liệu trả về `null`; field tùy chọn trong request có thể bỏ\
    \ qua.\n- Số đo luôn có đơn vị cố định theo schema (mg/dL, mmHg, kg, cm, minute, step).\n- Endpoint\
    \ danh sách nhận `page` (mặc định 1), `pageSize` (mặc định 20, tối đa 100), `sort`,\n  `order=asc|desc`.\
    \ Khoảng thời gian nhận `from`, `to`.\n- Các POST để gửi lặp (ghi chỉ số, bữa ăn, medication intake)\
    \ nên hỗ trợ header\n  `Idempotency-Key`.\n- Schema/response được chú thích \"(suy ra từ mô tả, không\
    \ có interface tường minh trong tài liệu\n  gốc — xác nhận lại với backend trước khi triển khai)\"\
    \ là phần được suy diễn hợp lý từ mô tả\n  prose của API_SPEC.docx, không phải transcription trực\
    \ tiếp.\n"
servers:
- url: /api/v1
  description: Base URL — tat ca path ben duoi la tuong doi so voi day
tags:
- name: Auth
  description: 'Dang nhap, phien lam viec


    **Đã triển khai**: POST /auth/login, GET /auth/me, POST /auth/change-password. **Kế hoạch**: POST
    /auth/refresh, POST /auth/logout, POST /auth/forgot-password (JSON login + cookie refresh token —
    khác cách auth thật hiện dùng OAuth2 form và không có refresh token).'
- name: Profile & Settings
  description: 'Ho so benh nhan va cai dat nguoi dung


    **Kế hoạch toàn bộ** — backend chưa có endpoint hồ sơ/cài đặt/avatar nào.'
- name: Dashboard
  description: 'Dashboard tong hop cho benh nhan


    **Kế hoạch toàn bộ** — backend chưa có endpoint tổng hợp dashboard nào.'
- name: Glucose
  description: 'Chi so duong huyet


    **Kế hoạch toàn bộ** (đọc/ghi có timing, status tự phân loại, tóm tắt theo ngày, phân trang). Xem
    tag Health Records cho API glucose thật đang chạy — đơn giản hơn nhiều.'
- name: Vitals
  description: 'Huyet ap, can nang, hoat dong the chat


    **Kế hoạch toàn bộ** — huyết áp và cân nặng chưa có model nào ở backend. Hoạt động thể chất có một
    bản đơn giản hơn đang chạy thật ở tag Health Records.'
- name: Medications
  description: 'Thuoc va tuan thu dung thuoc


    **Kế hoạch toàn bộ** — backend chưa có model thuốc/lịch uống/medication intake nào.'
- name: Meals
  description: 'Bua an va phan tich dinh duong bang AI


    **Kế hoạch toàn bộ** (phân tích dinh dưỡng bằng AI, upload ảnh, nutrition breakdown). Xem tag Health
    Records cho API ghi bữa ăn thật đang chạy — chỉ mô tả text tự do, không AI.'
- name: Tasks
  description: 'Cong viec hang ngay cua benh nhan


    **Kế hoạch toàn bộ** — backend chưa có khái niệm daily task nào.'
- name: Notifications
  description: 'Thong bao


    **Kế hoạch toàn bộ** — backend chưa có hệ thống notification nào.'
- name: Doctor
  description: 'Dashboard bac si, benh nhan duoc phan cong, ghi chu lam sang


    **Đã triển khai**: GET /doctor/patients (danh sách bệnh nhân được phân công). **Kế hoạch**: phần còn
    lại (hồ sơ bác sĩ, dashboard, chi tiết bệnh nhân, overview, ghi chú lâm sàng, ngưỡng glucose).'
- name: Appointments
  description: 'Lich hen tai kham


    **Đã triển khai**: POST/GET /appointments, PATCH /appointments/{id}/status. **Kế hoạch**: PATCH/DELETE
    /appointments/{id} dạng tổng quát (đổi giờ/loại/địa điểm, hủy) — backend hiện chỉ đổi được status
    qua sub-path riêng và không có DELETE.'
- name: AI Assistant
  description: 'Hoi thoai AI va tom tat suc khoe


    **Kế hoạch toàn bộ** (hội thoại nhiều lượt lưu lại theo từng bệnh nhân, feedback, SSE streaming).
    Xem tag AI Agent cho endpoint chat thật đang chạy — thiết kế hoàn toàn khác (một lượt, không xác thực,
    không gắn bệnh nhân).'
- name: Admin
  description: 'Quan ly tai khoan he thong


    **Đã triển khai**: POST/GET /admin/users, POST /admin/users/{id}/reset-password, POST/GET /admin/patient-assignments,
    DELETE /admin/patient-assignments/{id}. **Kế hoạch**: /admin/dashboard, GET/PATCH/DELETE /admin/users/{id},
    PATCH /admin/users/{id}/status.'
- name: Health Records
  description: 'Nhật ký sức khoẻ thật đang chạy trên backend hôm nay: glucose, bữa ăn, vận động — ghi
    nhận + liệt kê đơn giản (không timing/status/pagination/tóm tắt). **Đã triển khai toàn bộ.**'
- name: AI Agent
  description: Agent hội thoại chung (LangGraph) đang chạy thật trên backend — một lượt hỏi/đáp, không
    xác thực, không gắn với bệnh nhân/role nào. **Đã triển khai toàn bộ.**
- name: Infra
  description: Endpoint hạ tầng ngoài /api/v1. **Đã triển khai toàn bộ.**
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Đăng nhập bằng email/password (OAuth2 password flow)
      tags:
      - Auth
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/ImplUnauthorized'
        '403':
          description: Tài khoản bị vô hiệu hoá (is_active=false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          $ref: '#/components/responses/ImplValidationError'
      operationId: authLogin
      description: 'Form field `username` nhận email (không phải username thật), gửi qua application/x-www-form-urlencoded
        (OAuth2PasswordRequestForm), không phải JSON. Trả JWT access token chứa sub (user id), role, tv
        (token_version) và exp theo access_token_expire_minutes (mặc định 60 phút). Không có refresh token
        hay cookie — token hết hạn thì phải đăng nhập lại.


        Public. Đã triển khai — thay thế hoàn toàn contract JSON body + { data: ... } + refresh-cookie
        mô tả trước đây cho cùng path này (xem banner đầu tài liệu).'
      x-required-roles: []
      x-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  format: email
                  description: Email tài khoản (field OAuth2 tên là username nhưng nhận email)
                  example: an.nguyen@email.com
                password:
                  type: string
                  format: password
                grant_type:
                  type: string
                  pattern: ^password$
                  nullable: true
                scope:
                  type: string
                  default: ''
                client_id:
                  type: string
                  nullable: true
                client_secret:
                  type: string
                  nullable: true
  /auth/refresh:
    post:
      summary: Cap access token moi tu refresh token
      tags:
      - Auth
      responses:
        '200':
          description: Token moi
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      expiresIn:
                        type: integer
                        example: 900
        default:
          $ref: '#/components/responses/UnexpectedError'
      operationId: authRefresh
      description: 'Refresh token duoc gui qua cookie HttpOnly (khong qua body).


        Public'
      x-required-roles: []
      security: []
      x-status: planned
  /auth/logout:
    post:
      summary: Thu hoi phien dang nhap
      tags:
      - Auth
      responses:
        '204':
          description: Thành công, không có nội dung trả về
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
      operationId: authLogout
      description: 'Quyền: patient, doctor, admin'
      x-required-roles:
      - patient
      - doctor
      - admin
      x-status: planned
  /auth/me:
    get:
      summary: Lấy user hiện tại theo JWT hiện hành
      tags:
      - Auth
      responses:
        '200':
          description: User hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401':
          $ref: '#/components/responses/ImplUnauthorized'
      operationId: authMe
      description: 'Quyền: patient, doctor, admin (bất kỳ ai có access token hợp lệ, chưa hết hạn, và
        token_version còn khớp — đổi/reset mật khẩu sẽ vô hiệu hoá các token cũ).


        Đã triển khai — response trả thẳng UserPublic, không bọc { data: ... } như thiết kế gốc.'
      x-required-roles:
      - patient
      - doctor
      - admin
      x-status: implemented
  /auth/forgot-password:
    post:
      summary: Gui email dat lai mat khau
      tags:
      - Auth
      responses:
        '204':
          description: Thành công, không có nội dung trả về
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
      operationId: authForgotPassword
      description: Public
      x-required-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      x-status: planned
  /auth/change-password:
    post:
      summary: Đổi mật khẩu của chính mình
      tags:
      - Auth
      responses:
        '200':
          description: Đổi mật khẩu thành công, token cũ bị vô hiệu hoá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Mật khẩu hiện tại không đúng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '401':
          $ref: '#/components/responses/ImplUnauthorized'
        '422':
          $ref: '#/components/responses/ImplValidationError'
      operationId: authChangePassword
      description: 'Tăng token_version của user nên mọi access token đã phát hành trước đó (kể cả token
        đang dùng để gọi API này) đều bị vô hiệu — client phải lưu lại access_token mới trong response.


        Quyền: patient, doctor, admin. Đã triển khai — không có trong bản đặc tả gốc.'
      x-required-roles:
      - patient
      - doctor
      - admin
      x-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - new_password
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
                  maxLength: 72
  /patients/me:
    get:
      summary: Lay ho so benh nhan cua chinh minh
      tags:
      - Profile & Settings
      responses:
        '200':
          description: Ho so benh nhan
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/PatientProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
      operationId: getMyPatientProfile
      description: 'Quyền: patient'
      x-required-roles:
      - patient
      x-status: planned
    patch:
      summary: Cap nhat ho so ca nhan
      tags:
      - Profile & Settings
      responses:
        '200':
          description: Ho so sau cap nhat
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/PatientProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
      operationId: updateMyPatientProfile
      description: 'Chi cap nhat: name, phone, address, dateOfBirth, gender, heightCm, emergencyContact.
        Khong cho patient tu sua diagnosis, bac si phu trach hoac nguong duong huyet (glucoseTargets).


        Quyền: patient'
      x-required-roles:
      - patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                  nullable: true
                address:
                  type: string
                  nullable: true
                dateOfBirth:
                  type: string
                  format: date
                  nullable: true
                gender:
                  $ref: '#/components/schemas/Gender'
                heightCm:
                  type: number
                  minimum: 0
                  nullable: true
                emergencyContact:
                  allOf:
                  - $ref: '#/components/schemas/EmergencyContact'
                  nullable: true
      x-status: planned
  /users/me/avatar:
    post:
      summary: Tai anh dai dien
      tags:
      - Profile & Settings
      responses:
        '200':
          description: Avatar da tai len
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - avatarUrl
                    properties:
                      avatarUrl:
                        type: string
                        format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
      operationId: uploadMyAvatar
      description: 'Quyền: patient, doctor, admin'
      x-required-roles:
      - patient
      - doctor
      - admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      x-status: planned
  /users/me/settings:
    get:
      summary: Lay cai dat nguoi dung hien tai
      tags:
      - Profile & Settings
      responses:
        '200':
          description: Cai dat
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
      operationId: getMySettings
      description: 'Quyền: patient, doctor, admin'
      x-required-roles:
      - patient
      - doctor
      - admin
      x-status: planned
    patch:
      summary: Cap nhat mot phan cai dat nguoi dung
      tags:
      - Profile & Settings
      responses:
        '200':
          description: Cai dat sau cap nhat
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/UnexpectedError'
      operationId: updateMySettings
      description: 'Quyền: patient, doctor, admin'
      x-required-roles:
      - patient
      - doctor
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsUpdateRequest'
      x-status: planned
  /patients/me/dashboard:
    get:
      summary: Dashboard tong hop cho benh nhan (tranh goi nhieu API khi mo dashboard)
      tags:
      - Dashboard
      responses:
        '200':
          description: Du lieu dashboard
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - patient
                    - latestMetrics
                    - glucoseSeries
                    - tasks
                    properties:
                      patient:
                        type: object
                        required:
                        - id
                        - name
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                          avatarUrl:
                            type: string
                            format: uri
                            nullable: true
                      latestMetrics:
                        type: object
                        properties:
                          glucose:
                            allOf:
                            - $ref: '#/components/schemas/GlucoseReading'
                            nullable: true
                          bloodPressure:
                            allOf:
                            - $ref: '#/components/schemas/BloodPressureReading'
                            nullable: true
                          weight:
                            allOf:
                            - $ref: '#/components/schemas/WeightReading'
                            nullable: true
                          steps:
                            type: integer
                            nullable: true
                      glucoseSeries:
                        type: array
                        items:
                          $ref: '#/components/schemas/GlucoseDayBucket'
                      tasks:
                        type: array
                        items:
                          $ref: '#/components/schemas/DailyTask'
                      insight:
                        type: object
                        nullable: true
                        properties:
                          summary:
                            type: string
                          generatedAt:
                            type: string
                            format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/UnexpectedError'
      operationId: getMyDashboard
      description: 'Du lieu chi tiet van lay tu cac endpoint domain rieng (glucose, blood pressure...).


        Quyền: patient'
      x-required-roles:
      - patient
      parameters:
      - name: date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Ngay tham chieu, mac dinh hom nay
      - name: range
        in: query
        required: false
        schema:
          type: string
          enum:
          - 7d
          - 30d
          - 3m
